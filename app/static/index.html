<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>catan-solver — live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <section id="board-wrap">
      <svg id="board" viewBox="-320 -300 640 600" preserveAspectRatio="xMidYMid meet"></svg>

      <div id="board-status">
        <span id="live-dot"></span>
        <span id="live-text">connecting…</span>
        <button id="live-toggle" title="pause / resume">⏸</button>
      </div>

      <div id="hint-banner" class="hidden"></div>

      <form id="open-bar" autocomplete="off">
        <input id="open-url" type="text" spellcheck="false"
               placeholder="paste a colonist.io game link" />
        <button type="submit">Open</button>
      </form>
    </section>

    <aside id="panel">
      <header id="turn-bar">
        <div class="turn-row">
          <span id="turn-label">waiting for a game</span>
          <span id="timer"></span>
        </div>
        <div id="turn-sub"></div>
        <div id="hand-strip"></div>
      </header>

      <div id="urgent"></div>
      <div id="primary"></div>
      <div id="actions"></div>

      <div id="intel">
        <details id="intel-players" open>
          <summary>Players</summary>
          <div id="players"></div>
        </details>
        <details id="intel-dice">
          <summary>Dice <span id="dice-sub"></span></summary>
          <div id="rolls"></div>
          <div id="dice"></div>
        </details>
        <details id="intel-log">
          <summary>Game log</summary>
          <div id="log"></div>
        </details>
      </div>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
