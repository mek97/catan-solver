[project]
name = "catan-solver"
version = "0.1.0"
description = "Catan board parser + move recommender for colonist.io"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "anthropic",
    "pydantic>=2",
    "python-multipart",
    "msgpack>=1.2.1",
    "requests>=2.34.2",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
